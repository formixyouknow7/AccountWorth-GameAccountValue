<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оценка аккаунтов</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    margin:0;
    padding:20px;
}
.container{
    max-width:600px;
    margin:auto;
    background:#1a1a1a;
    padding:20px;
    border-radius:15px;
}
h1{
    text-align:center;
}
select,input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
}
button{
    background:#00c853;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
.result{
    margin-top:20px;
    font-size:24px;
    text-align:center;
}
</style>
</head>
<body>

<div class="container">
    <h1>💰 Сколько стоит мой аккаунт?</h1>

    <label>Игра</label>
    <select id="game">
        <option>Roblox</option>
        <option>Brawl Stars</option>
        <option>Fortnite</option>
        <option>Steam</option>
    </select>

    <label>Сколько денег вложено?</label>
    <input type="number" id="spent" placeholder="Например 10000">

    <label>Возраст аккаунта (лет)</label>
    <input type="number" id="age" placeholder="Например 3">

    <button onclick="calculate()">Оценить</button>

    <div class="result" id="result"></div>
</div>

<script>
function calculate(){
    let spent = Number(document.getElementById("spent").value);
    let age = Number(document.getElementById("age").value);

    let price = Math.round(spent * 0.25 + age * 500);

    document.getElementById("result").innerHTML =
    "Примерная стоимость: " + price + " ₽";
}
</script>

</body>
</html>
