<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AccountWorth</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#0d0d0d;
    color:white;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    border-bottom:1px solid #222;
}

.logo{
    font-size:24px;
    font-weight:700;
}

.login{
    background:#2563eb;
    border:none;
    color:white;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
}

.hero{
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:48px;
    margin-bottom:15px;
}

.hero p{
    color:#999;
    font-size:18px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-top:40px;
}

.game{
    background:#171717;
    border:1px solid #222;
    border-radius:16px;
    padding:25px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.game:hover{
    transform:translateY(-4px);
    border-color:#2563eb;
}

.form{
    background:#171717;
    margin-top:30px;
    padding:25px;
    border-radius:18px;
}

input{
    width:100%;
    padding:14px;
    background:#0f0f0f;
    border:1px solid #333;
    border-radius:12px;
    color:white;
    margin-top:12px;
}

button.calc{
    width:100%;
    margin-top:15px;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.result{
    margin-top:20px;
    text-align:center;
    font-size:28px;
    font-weight:700;
}

footer{
    text-align:center;
    color:#777;
    padding:40px;
}
</style>
</head>

<body>

<header>
    <div class="logo">💰 AccountWorth</div>
    <button class="login">Войти</button>
</header>

<section class="hero">
    <h1>Узнай стоимость своего аккаунта</h1>
    <p>Roblox • Steam • Fortnite • Brawl Stars</p>
</section>

<div class="container">

    <div class="games">
        <div class="game">🎮 Roblox</div>
        <div class="game">🔥 Fortnite</div>
        <div class="game">🚂 Steam</div>
        <div class="game">⭐ Brawl Stars</div>
    </div>

    <div class="form">

        <input type="number" id="spent" placeholder="Сколько вложено денег?">

        <input type="number" id="age" placeholder="Возраст аккаунта (лет)">

        <button class="calc" onclick="calculate()">
            Оценить аккаунт
        </button>

        <div class="result" id="result"></div>

    </div>

</div>

<footer>
    © 2026 AccountWorth
</footer>

<script>
function calculate(){
    let spent = Number(document.getElementById('spent').value);
    let age = Number(document.getElementById('age').value);

    let price = Math.round(spent * 0.25 + age * 500);

    document.getElementById('result').innerHTML =
        "≈ " + price.toLocaleString() + " ₽";
}
</script>

</body>
</html>
